[package]
name = "x_card_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
parley = { version = "0.11.1", features = ["complex-scripts"] }
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
env_logger = "0.11.11"
log = "0.4.34"
